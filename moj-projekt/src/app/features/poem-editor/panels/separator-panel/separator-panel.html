<div class="color-picker-container">

  <!-- HEADER -->
  <div class="picker-header">
    <div>
      <h2 class="picker-title">Separatory</h2>
      <p class="picker-subtitle">Wybierz separator lub emoji</p>
    </div>
   
  </div>

  <!-- MAIN CATEGORY -->
  <div class="categories-tabs">
    <button
      *ngFor="let category of categories"
      class="tab-button"
      [class.active]="activeCategory === category.name"
      (click)="setCategory(category)"
    >
      {{ category.label }}
    </button>
  </div>

  <!-- SUBCATEGORY -->
  <div class="sub-tabs">
    <button
      *ngFor="let sub of currentCategory.subcategories"
      [class.active]="activeSubCategory === sub.name"
      (click)="activeSubCategory = sub.name"
    >
      {{ sub.label }}
    </button>
  </div>

  <!-- GRID -->
  <div class="colors-grid">
    <div
      *ngFor="let item of currentSubCategory.separators"
      class="color-item"
      [class.selected]="selectedSeparator?.id === item.id"
      (click)="selectSeparator(item)"
    >
      <div class="color-swatch symbol-box">
        <span class="symbol">{{ item.symbol }}</span>
      </div>

      <span class="color-name">{{ item.name }}</span>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-section">
    <h3 class="preview-label">Podgląd</h3>
    <div class="preview-box">
      <p class="preview-text">
        {{ selectedSeparator?.symbol || '♥ ✦ ♥' }}
      </p>
    </div>
  </div>

  <!-- BUTTON -->
  <button class="apply-button">
    ✓ Zastosuj separator
  </button>

</div>
