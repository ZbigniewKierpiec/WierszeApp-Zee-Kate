<div class="color-picker-container">
  <!-- HEADER -->
  <div class="picker-header">
    <div>
      <h2 class="picker-title">Tło</h2>
      <p class="picker-subtitle">Wybierz styl tła</p>
    </div>

    <button class="close-button" (click)="close()">×</button>
  </div>

  <!-- MAIN TABS -->
  <div class="main-tabs">
    <button
      *ngFor="let section of categories"
      class="tab-button"
      [class.active]="activeMainCategory === section.name"
      (click)="changeMainCategory(section.name)"
    >
      {{ section.label }}
    </button>
  </div>

  <!-- SUB TABS -->
  <div class="categories-tabs">
    <button
      *ngFor="let category of currentMainCategories"
      class="tab-button"
      [class.active]="activeCategory === category.name"
      (click)="activeCategory = category.name"
    >
      {{ category.label }}
    </button>
  </div>

  <!-- COLORS -->
  <div class="colors-grid">
    <div
      *ngFor="let color of currentCategory.colors"
      class="color-item"
      [class.selected]="selectedColor?.id === color.id"
      (click)="selectColor(color)"
    >
      <div
        class="color-swatch"
        [style.background-image]="color.image ? 'url(' + color.image + ')' : null"
        [style.background-color]="!color.image ? color.hex : null"
      >
        <div class="overlay"></div>

        <span class="color-number">
          {{ color.id }}
        </span>
      </div>

      <span class="color-name">
        {{ color.name }}
      </span>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-section">
    <h3 class="preview-label">Podgląd</h3>

    <div
      class="preview-box"
      [style.background-image]="
        selectedColor?.image
          ? 'linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)), url(' +
            selectedColor?.image +
            ')'
          : null
      "
      [style.background-color]="
        !selectedColor?.image ? selectedColor?.hex : null
      "
    >
      <p class="preview-text">
        Gdy zamknę oczy, widzę tylko Ciebie.
      </p>
    </div>
  </div>

  <!-- BUTTON -->
  <button
    class="apply-button"
    [disabled]="!selectedColor"
    (click)="applyColor()"
  >
    ✓ Zastosuj tło
  </button>
</div>
