<div class="editor-shell">
  <div class="phone">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="left">
        <button class="back-btn" (click)="goBack()">← <span>Edytor wiersza</span></button>
      </div>

      <div class="right">
        <span class="icon">↶</span>

        <span class="icon">↷</span>

        <button class="save">Zapisz</button>
      </div>
    </div>

    <!-- PREVIEW -->
    <div
      class="preview"
      (click)="clearSeparatorSelection(); activeTextIndex = null; miniMenuVisible = false"
    >
      <!-- PAPER -->
      <div class="paper" [style.background-color]="backgroundColor">
        <!-- FRAME -->
        <div
          *ngIf="backgroundImage"
          class="background-frame"
          [style.background-image]="backgroundImage"
        ></div>

        <!-- POEM -->
        <div
          #poemBox
          class="poem"
          [style.width.%]="contentBox.width"
          [style.height.%]="contentBox.height"
          [style.top.%]="50 + contentBox.offsetY"
          [style.left.%]="50"
          [style.transform]="'translate(-50%, -50%)'"
        >
          <!-- CONTENT -->
          <div
            #poemContent
            class="poem-content"
            [style.font-size.px]="autoTextStyle.fontSize"
            [style.line-height]="autoTextStyle.lineHeight"
            [style.gap.px]="autoTextStyle.gap"
            [style.--poem-max-width]="textStyle.maxWidth"
          >
            <!-- STANZAS -->
            <ng-container *ngFor="let line of poemLines; let i = index">
              <!-- POEM BLOCK -->
              <div
                class="poem-block"
                contenteditable="true"
                (click)="selectText(i, $event); $event.stopPropagation()"
                (input)="fitTextToContainer()"
                [class.active]="activeTextIndex === i"
                [style.color]="textColors[i] || poemColor"
                [style.font-family]="fontOverrides[i]?.fontFamily || poemFont"
                [style.font-weight]="
                  styleOverrides[i]?.weight || fontOverrides[i]?.fontWeight || poemFontWeight
                "
                [style.font-style]="
                  styleOverrides[i]?.italic
                    ? 'italic'
                    : fontOverrides[i]?.fontStyle || poemFontStyle
                "
                [style.text-align]="styleOverrides[i]?.align || 'center'"
                [style.letter-spacing]="styleOverrides[i]?.spacing || '0px'"
                [style.text-transform]="styleOverrides[i]?.transform || 'none'"
                [style.opacity]="styleOverrides[i]?.opacity ?? 1"
                [style.text-shadow]="styleOverrides[i]?.shadow || 'none'"
              >
                {{ line }}
              </div>

              <!-- SEPARATOR -->
              <div
                *ngIf="i < poemLines.length - 1"
                class="separator"
                [class.active]="activeSeparatorIndex === i"
                [style.color]="separatorColors[i] || poemColor"
                (click)="selectSeparator(i, $event); $event.stopPropagation()"
              >
                {{ separators[i] || '✧' }}
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>

    <!-- MINI MENU -->
    <div
      *ngIf="miniMenuVisible"
      class="mini-menu"
      [style.top.px]="miniMenuPosition.y"
      [style.left.px]="miniMenuPosition.x"
    >
      <!-- TEXT -->
      <ng-container *ngIf="activeTextIndex !== null">
        <button class="menu-item" (click)="openPanel('colors')">🎨 <span>Kolor</span></button>

        <div class="divider"></div>

        <button class="menu-item" (click)="openPanel('fonts')">🔤 <span>Font</span></button>

        <div class="divider"></div>

        <button class="menu-item" (click)="openPanel('style')">✨ <span>Styl</span></button>
      </ng-container>

      <!-- SEPARATORS -->
      <ng-container *ngIf="activeSeparatorIndex !== null">
        <button class="menu-item" (click)="openPanel('colors')">🎨 <span>Kolor</span></button>

        <div class="divider"></div>

        <button class="menu-item" (click)="openPanel('decorations')">❀ <span>Symbol</span></button>
      </ng-container>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button
        *ngFor="let tab of editorTabs"
        class="tab"
        [class.active]="activePanel === tab.id"
        (click)="activePanel = tab.id"
      >
        <span>{{ tab.icon }}</span>

        <small>{{ tab.label }}</small>
      </button>
    </div>
  </div>

  <!-- SIDE PANEL -->
  <div class="side-panel" [class.open]="activePanel">
    <ng-container *ngComponentOutlet="panelMap[activePanel]; inputs: currentPanelInputs">
    </ng-container>
  </div>
</div>
