<div class="editor-shell">
  <div class="phone">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="left">
        <button class="back-btn" (click)="goBack()">← <span>Edytor wiersza</span></button>
      </div>

      <div class="right">
        <span class="icon">↶</span>
        <span class="icon">↷</span>
        <button class="save">Zapisz</button>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview">
      <div class="paper" [style.background-color]="backgroundColor">
        <!-- BACKGROUND -->
        <div
          *ngIf="backgroundImage"
          class="background-frame"
          [style.background-image]="backgroundImage"
        ></div>

        <!-- POEM -->
        <div
          #poemBox
          class="poem"
           [class.full-page]="!backgroundImage || backgroundImage === ''"

  [style.width.%]="backgroundImage ? contentBox.width : null"
  [style.height.%]="backgroundImage ? contentBox.height : null"

  [style.top.%]="backgroundImage ? 50 + contentBox.offsetY : null"
  [style.left.%]="backgroundImage ? 50 : null"

  [style.transform]="backgroundImage ? 'translate(-50%, -50%)' : null"
        >
          <div
            #poemContent
            class="poem-content"
            [style.font-size.px]="autoTextStyle.fontSize"
            [style.line-height]="autoTextStyle.lineHeight"
            [style.font-family]="poemFont"
            [style.font-weight]="poemFontWeight"
            [style.font-style]="poemFontStyle"
            [style.color]="poemColor"
            contenteditable="true"
            (input)="fitTextToContainer()"
          >
            {{ rawText }}
          </div>
        </div>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button
        *ngFor="let tab of editorTabs"
        class="tab"
        [class.active]="activePanel === tab.id"
        (click)="activePanel = tab.id"
      >
        <span>{{ tab.icon }}</span>
        <small>{{ tab.label }}</small>
      </button>
    </div>
  </div>

  <!-- SIDE PANEL -->
  <div class="side-panel" [class.open]="activePanel">
    <ng-container *ngComponentOutlet="panelMap[activePanel]; inputs: currentPanelInputs">
    </ng-container>
  </div>
</div>
